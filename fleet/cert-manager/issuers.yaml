---
# Self-signed issuer for root CA (bootstrap)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}

---
# Root CA certificate (self-signed, valid 10 years)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "integrant-root-ca"
  secretName: root-ca-secret
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned
    kind: Issuer
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days

---
# Intermediate CA Issuer (uses root CA)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: intermediate-ca
spec:
  ca:
    secretRef:
      name: root-ca-secret
      namespace: cert-manager

---
# Wildcard certificate for *.integrant.com (90 days, auto-renewed)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-integrant-com
  namespace: cert-manager
spec:
  secretName: wildcard-integrant-tls
  commonName: "*.integrant.com"
  dnsNames:
    - "*.integrant.com"
    - "*.upstream.integrant.com"
    - "*.downstream.integrant.com"
    - "integrant.com"
  issuerRef:
    name: intermediate-ca
    kind: ClusterIssuer
  duration: 2160h # 90 days
  renewBefore: 720h # Renew 30 days before expiry
  privateKey:
    algorithm: RSA
    size: 2048
