---
defaultNamespace: cert-manager

helm:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: "v1.14.4"
  releaseName: cert-manager
  valuesFiles:
    - values.yaml

targets:
  - name: local
    clusterSelector:
      matchLabels:
        env: local
  - name: downstream
    clusterSelector:
      matchLabels:
        env: downstream
