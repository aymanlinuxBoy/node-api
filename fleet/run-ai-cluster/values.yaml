---
## Run:ai Cluster Services Helm values
## Docs: https://docs.run.ai/self-hosted/install-cluster

controlPlane:
  # URL of the control plane (will be set to control plane hostname)
  url: "https://runai-control.integrant.com"
  # Client secret will be obtained from control plane after deployment
  clientSecret: "CHANGE_ME_AFTER_CONTROL_PLANE_DEPLOYED"

cluster:
  # Unique cluster identifier
  uid: "downstream-rke2"
  # Cluster URL (for control plane to reach this cluster)
  url: "https://runai-cluster.integrant.com"

clusterConfig:
  global:
    ingress:
      ingressClass: "haproxy"
      annotations:
        cert-manager.io/cluster-issuer: "intermediate-ca"
    tls:
      enabled: true
      secretName: "wildcard-integrant-tls"

  # Prometheus for metrics (uses existing Prometheus if available)
  prometheus:
    enabled: true
    operator:
      enabled: false  # Set to true if using prometheus-operator
    scrapeInterval: 30s

  # KAI Scheduler
  kaiScheduler:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Resource Management
  resourceManager:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

  # Admission Controller (for policy enforcement)
  admissionController:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# GPU-related settings (ready for when GPUs available)
kubernetesDistribution: "rke2"
gpuOperator:
  enabled: true

customCA:
  enabled: false
