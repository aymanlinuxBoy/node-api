---
defaultNamespace: runai

helm:
  repo: https://helm.ngc.nvidia.com/nvidia/runai
  chart: runai-cluster
  releaseName: runai-cluster
  valuesFiles:
    - values.yaml
  username: "$oauthtoken"
  passwordFromSecret:
    name: runai-ngc-secret
    key: ngc-api-key

targets:
  - name: downstream
    clusterSelector:
      matchLabels:
        env: downstream
