apiVersion: v1
kind: ConfigMap
metadata:
  name: datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.logging.svc.cluster.local
        port: 80
        isDefault: false
        version: 1
        editable: true
