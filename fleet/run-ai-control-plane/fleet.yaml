---
defaultNamespace: runai-backend

helm:
  repo: https://helm.ngc.nvidia.com/nvidia/runai
  chart: control-plane
  releaseName: runai-backend
  valuesFiles:
    - values.yaml
  username: "$oauthtoken"
  passwordFromSecret:
    name: runai-ngc-secret
    key: ngc-api-key

targets:
  - name: local
    clusterSelector:
      matchLabels:
        env: local
