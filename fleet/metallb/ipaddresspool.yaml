---
# ┌──────────────────────────────────────────────────────────────────┐
# │               MetalLB — L2 Mode Only                            │
# │                                                                  │
# │  Pools:                                                          │
# │    ingress-internal → 10.50.0.100     (Run:ai internal VIP)     │
# │    ingress-public   → 176.57.189.45   (Traefik public — MetalLB)│
# │    apps-pool        → 94.250.202.136  (general workloads)       │
# │                        173.249.48.125                            │
# │                                                                  │
# │  Grafana:    grafana.176.57.189.45.sslip.io → MetalLB → Traefik │
# │  Prometheus: prometheus.176.57.189.45.sslip.io → MetalLB        │
# │                                                                  │
# │  ingress-internal floats (HA) — public IPs pinned to owner node  │
# │  No BGP — pure L2/ARP advertisement on br-metallb.              │
# └──────────────────────────────────────────────────────────────────┘

---
# Pool 1 — Run:ai internal ingress VIP
# 10.50.0.100 is not a public IP — used for in-cluster Run:ai routing only.
# autoAssign: false — Traefik claims it via metallb.io/address-pool annotation.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ingress-internal
  namespace: metallb-system
spec:
  addresses:
    - 10.50.0.100/32
  autoAssign: false
  avoidBuggyIPs: false
  serviceAllocation:
    priority: 10
    namespaces:
      - kube-system

---
# Pool 2 — Traefik public ingress VIP
# 176.57.189.45 is the control-plane (vmi3565261) public IP.
# MetalLB advertises this via ARP so all *.176.57.189.45.sslip.io ingress
# hostnames (Grafana, Prometheus, etc.) are served through MetalLB → Traefik.
# autoAssign: false — Traefik claims it via metallb.io/address-pool annotation.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ingress-public
  namespace: metallb-system
spec:
  addresses:
    - 176.57.189.45/32
  autoAssign: false
  avoidBuggyIPs: false
  serviceAllocation:
    priority: 20
    namespaces:
      - kube-system

---
# Pool 3 — General workloads / apps
# Available to all namespaces, auto-assigned.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: apps-pool
  namespace: metallb-system
spec:
  addresses:
    - 94.250.202.136/32   # vmi3565262 (GPU worker)
    - 173.249.48.125/32   # vmi3577894 (GPU worker)
  autoAssign: true
  avoidBuggyIPs: false

---
# L2 Advertisement — ingress-internal VIP floats for HA
# 10.50.0.100 is not physically bound to any NIC so MetalLB can
# elect any node as speaker — automatic failover when a node goes down.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-ingress-internal
  namespace: metallb-system
spec:
  ipAddressPools:
    - ingress-internal
  interfaces:
    - br-metallb
  # No nodeSelectors — MetalLB elects speaker dynamically for HA

---
# L2 Advertisement — ingress-public pinned to vmi3565261
# 176.57.189.45 is physically on vmi3565261's NIC — must stay on that node.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-ingress-public
  namespace: metallb-system
spec:
  ipAddressPools:
    - ingress-public
  interfaces:
    - br-metallb
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: vmi3565261

---
# L2 Advertisement — apps-pool: each IP pinned to its owning GPU worker node
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-apps-vmi3565262
  namespace: metallb-system
spec:
  ipAddressPools:
    - apps-pool
  interfaces:
    - br-metallb
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: vmi3565262

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-apps-vmi3577894
  namespace: metallb-system
spec:
  ipAddressPools:
    - apps-pool
  interfaces:
    - br-metallb
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: vmi3577894
