loki:
  schemaConfig:
    configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
  storageConfig:
    filesystem:
      directory: /var/loki-shared/boltdb-shipper-data
    boltdb_shipper:
      shared_store: filesystem
      active_index_directory: /var/loki-shared/boltdb-shipper-active
      cache_location: /var/loki-shared/boltdb-shipper-cache
  auth_enabled: false
  limits_config:
    max_cache_freshness_per_query: 10m
  ingester:
    max_chunk_age: 2h
    chunk_idle_period: 3m
    max_chunk_size: 6291456

distributor:
  replicas: 2
  maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingester:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: shared-data
      persistentVolumeClaim:
        claimName: loki-shared-data
  extraVolumeMounts:
    - name: shared-data
      mountPath: /var/loki-shared
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

querier:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: shared-data
      persistentVolumeClaim:
        claimName: loki-shared-data
  extraVolumeMounts:
    - name: shared-data
      mountPath: /var/loki-shared
  # Force co-location with the ingester pod so both can mount the same
  # ReadWriteOnce local-path PVC (filesystem object store has no shared
  # storage otherwise - see loki-shared-data PVC).
  affinity: |
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - ingester
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

queryFrontend:
  replicas: 2
  maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

minio:
  enabled: false

chunksCache:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

resultsCache:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
