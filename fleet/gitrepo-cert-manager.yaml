---
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: cert-manager
  namespace: fleet-default
spec:
  repo: https://github.com/aymanlinuxBoy/node-api.git
  branch: main
  paths:
    - fleet/cert-manager
  targets:
    - name: local
      clusterSelector:
        matchLabels:
          env: local
    - name: downstream
      clusterSelector:
        matchLabels:
          env: downstream
