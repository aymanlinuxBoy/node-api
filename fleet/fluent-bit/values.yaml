## Fluent Bit Helm values
## Docs: https://github.com/fluent/helm-charts/tree/main/charts/fluent-bit

kind: DaemonSet

replicaCount: 1

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: ""  # defaults to chart appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true
  nodeAccess: true
  eventsAccess: true

podSecurityContext:
  {}

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

## Fluent Bit config
config:
  service: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Health_Check On

  ## Tail container logs from the node
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name              kubernetes_events
        Tag               kube.events
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

    [INPUT]
        Name              fluentbit_metrics
        Tag               metrics.fluentbit
        Scrape_Interval   15

    [INPUT]
        Name              node_exporter_metrics
        Tag               metrics.node
        Scrape_Interval   15

  ## Kubernetes metadata enrichment — only for container logs, not events
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.var.log.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  ## Ship logs to Loki via the gateway
  outputs: |
    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              loki-gateway.logging.svc.cluster.local
        Port              80
        Labels            job=fluent-bit, source=container-logs
        auto_kubernetes_labels On
        Line_Format       json

    [OUTPUT]
        Name              loki
        Match             kube.events
        Host              loki-gateway.logging.svc.cluster.local
        Port              80
        Labels            job=fluent-bit, source=k8s-events
        Line_Format       json

    [OUTPUT]
        Name                prometheus_exporter
        Match               metrics.*
        Host                0.0.0.0
        Port                2021

  ## Expose /api/v1/health for readiness/liveness probes
  extraFiles: {}

extraPorts:
  - name: metrics
    containerPort: 2021
    protocol: TCP

luaScripts: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

## Increase inotify limits before Fluent Bit starts — fixes "Too many open files" (errno=24)
initContainers:
  - name: increase-inotify-limits
    image: busybox
    securityContext:
      privileged: true
    command:
      - sh
      - -c
      - |
        sysctl -w fs.inotify.max_user_instances=8192
        sysctl -w fs.inotify.max_user_watches=524288
