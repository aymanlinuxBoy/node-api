defaultNamespace: logging

helm:
  repo: https://fluent.github.io/helm-charts
  chart: fluent-bit
  version: "0.49.0"
  releaseName: fluent-bit
  valuesFiles:
    - values.yaml

targets:
  - name: downstream
    clusterSelector:
      matchLabels:
        env: downstream
    helm:
      values:
        config:
          outputs: |
            [OUTPUT]
                Name              loki
                Match             kube.var.log.*
                Host              loki-gateway.logging.svc.cluster.local
                Port              80
                Labels            job=fluent-bit, source=container-logs, cluster=downstream
                auto_kubernetes_labels On
                Line_Format       json

            [OUTPUT]
                Name              loki
                Match             kube.events
                Host              loki-gateway.logging.svc.cluster.local
                Port              80
                Labels            job=fluent-bit, source=k8s-events, cluster=downstream
                Line_Format       json

            [OUTPUT]
                Name              prometheus_exporter
                Match             metrics.*
                Host              0.0.0.0
                Port              2021

  - name: local
    clusterSelector:
      matchLabels:
        env: local
    helm:
      values:
        config:
          outputs: |
            [OUTPUT]
                Name              loki
                Match             kube.var.log.*
                Host              176.57.189.45
                Port              30100
                Labels            job=fluent-bit, source=container-logs, cluster=local
                auto_kubernetes_labels On
                Line_Format       json

            [OUTPUT]
                Name              loki
                Match             kube.events
                Host              176.57.189.45
                Port              30100
                Labels            job=fluent-bit, source=k8s-events, cluster=local
                Line_Format       json

            [OUTPUT]
                Name              prometheus_exporter
                Match             metrics.*
                Host              0.0.0.0
                Port              2021
