name: CI Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: node-api-poc

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action diffs against the previous commit SHA, which
          # requires full history — a shallow clone leaves that commit
          # unresolvable and fails with "unknown revision".
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: npm audit (dependency scan)
        run: npm audit --audit-level=high

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          yamllint .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: false
          # CKV_K8S_43 ("Image should use digest") is soft-failed: this repo
          # pins images by tag (see k8s/base/deployment.yaml), so we accept
          # the finding without blocking the pipeline on it.
          soft_fail_on: CKV_K8S_43

  build-scan-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Smoke test
        run: |
          docker run -d --name smoke \
            -p 8080:3000 \
            "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"

          echo "Waiting for container to be ready..."
          for i in $(seq 1 10); do
            if curl --silent --fail http://localhost:8080/health; then
              echo "Container is healthy"
              docker rm -f smoke
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done

          echo "Container failed to respond after 10 attempts"
          docker logs smoke
          docker rm -f smoke
          exit 1

      - name: Push image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"
