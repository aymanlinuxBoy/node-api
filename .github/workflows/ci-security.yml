name: CI Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: node-api-poc

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action diffs against the previous commit SHA, which
          # requires full history — a shallow clone leaves that commit
          # unresolvable and fails with "unknown revision".
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: npm audit (dependency scan)
        run: npm audit --audit-level=high

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          yamllint .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: false
          # CKV_K8S_43 ("Image should use digest") is soft-failed: this repo
          # pins images by tag (see k8s/base/deployment.yaml), so we accept
          # the finding without blocking the pipeline on it.
          soft_fail_on: CKV_K8S_43

  build-scan-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Determine image tag (semantic versioning)
        id: vars
        run: |
          # Check if current commit is tagged with a semantic version
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")

          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Use semantic version tag (strip 'v' prefix)
            echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Using semantic version tag: ${TAG#v}"
          else
            # Fall back to short SHA for non-tagged commits
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "No semantic version tag found, using short SHA: ${GITHUB_SHA::12}"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Smoke test
        run: |
          # Create network and postgres service for smoke test
          docker network create smoke-test-net || true
          docker run -d --name smoke-postgres \
            --network smoke-test-net \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=testdb \
            postgres:16-alpine

          sleep 5  # Wait for postgres to be ready

          docker run -d --name smoke \
            --network smoke-test-net \
            -p 8080:3000 \
            -e DB_HOST=smoke-postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=testdb \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"

          echo "Waiting for container to be ready..."
          for i in $(seq 1 10); do
            if curl --silent --fail http://localhost:8080/health; then
              echo "Container is healthy"
              docker rm -f smoke smoke-postgres
              docker network rm smoke-test-net
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done

          echo "Container failed to respond after 10 attempts"
          docker logs smoke
          docker rm -f smoke smoke-postgres
          docker network rm smoke-test-net
          exit 1

      - name: Tag and push image
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.tag }}"
          REGISTRY="${{ secrets.DOCKERHUB_USERNAME }}"

          # Push with version/SHA tag
          docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          # Also push as 'latest' if this is a semantic version tag (v1.0.0 format)
          if [[ $IMAGE_TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" "${REGISTRY}/${IMAGE_NAME}:latest"
            docker push "${REGISTRY}/${IMAGE_NAME}:latest"
            echo "Pushed semantic version ${IMAGE_TAG} and latest tag"
          fi
