---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-api-poc-bg
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aymanlinuxBoy/node-api.git
    targetRevision: main
    path: k8s/overlays/blue-green

  destination:
    name: downstream
    namespace: devsecops-bg

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
