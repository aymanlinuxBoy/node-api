apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-api-poc-canary-netpol
  namespace: devsecops-canary
spec:
  podSelector:
    matchLabels:
      app: node-api-poc-canary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
