# DO NOT apply this file directly and DO NOT commit real credentials to git.
# Create the real secret out-of-band instead:
#
#   kubectl create secret generic node-api-poc-db-credentials \
#     --namespace devsecops \
#     --from-literal=DB_USER=postgres \
#     --from-literal=DB_PASSWORD='<your-postgres-password>'
#
# This file only documents the expected shape for reference.
apiVersion: v1
kind: Secret
metadata:
  name: node-api-poc-db-credentials
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: CHANGEME
