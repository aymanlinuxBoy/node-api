---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: node-api-poc-verify-signature
  annotations:
    policies.kyverno.io/title: Verify Signed Node API Image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that Node API image references have a valid Cosign keyless
      signature from the trusted GitHub Actions workflow identity.
spec:
  # Audit-first: record signature violations without rejecting Pod admission.
  validationActions:
    - Audit
  # Keep the first rollout non-blocking if Kyverno or signature verification has an evaluation error.
  # Before production enforcement, use validationActions: [Deny] and failurePolicy: Fail.
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 20
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - devsecops
            - devsecops-bg
            - devsecops-canary
  # Exact repository names only; include tag and digest references.
  matchImageReferences:
    - glob: "docker.io/aimocont2020/node-api-poc"
    - glob: "docker.io/aimocont2020/node-api-poc:*"
    - glob: "docker.io/aimocont2020/node-api-poc@*"
    - glob: "aimocont2020/node-api-poc"
    - glob: "aimocont2020/node-api-poc:*"
    - glob: "aimocont2020/node-api-poc@*"
  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: true
  attestors:
    - name: ci_identity
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/aymanlinuxBoy/node-api/.github/workflows/ci-security.yml@refs/heads/main"
        ctlog:
          url: "https://rekor.sigstore.dev"
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.ci_identity])
        ).all(result, result > 0)
      message: >-
        The Node API image is not signed by the trusted node-api CI workflow
        (Cosign keyless verification failed).
