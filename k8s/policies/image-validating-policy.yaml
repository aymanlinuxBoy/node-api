---
apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: node-api-poc-verify-signature
spec:
  # Audit-first rollout: violations are recorded in Kyverno policy reports
  # but pods are NOT blocked yet. Once reports show no unexpected
  # rejections, flip this to `Deny` to actually enforce.
  validationActions:
    - Audit

  # A broken/unreachable webhook fails OPEN (pods still get admitted)
  # instead of failing closed and blocking all pod creation cluster-wide.
  failurePolicy: Ignore

  webhookConfiguration:
    timeoutSeconds: 20

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - devsecops
            - devsecops-bg
            - devsecops-canary

  matchImageReferences:
    - glob: "aimocont2020/node-api-poc*"

  validationConfigurations:
    required: false
    verifyDigest: false
    mutateDigest: false

  attestors:
    - name: ci_identity
      cosign:
        keyless:
          # Same Fulcio-issued identity the CI pipeline itself checks in
          # the "Verify signature" step of ci-security.yml.
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/aymanlinuxBoy/node-api/.github/workflows/ci-security.yml@refs/heads/main

  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ci_identity])).all(e, e > 0)
      message: >-
        node-api-poc image is not signed by this repo's CI pipeline
        (cosign keyless verification against the ci-security.yml workflow identity failed)
