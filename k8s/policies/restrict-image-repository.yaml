---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: node-api-poc-restrict-image-repository
  annotations:
    policies.kyverno.io/title: Restrict Application Image Repositories
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Restricts images by namespace: the shared devsecops namespaces may run
      the Node API and DevSecOps demo images; the canary namespace is limited
      to the Node API image repository.
spec:
  # Audit first; move to Deny after reviewing Audit findings and testing.
  validationActions:
    - Audit
  # Evaluation errors should not block workloads during the audit phase.
  # For production enforcement, use failurePolicy: Fail with validationActions: [Deny].
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - pods
          - pods/ephemeralcontainers
  matchConditions:
    - name: node-api-namespaces-only
      expression: >-
        object.metadata.namespace in
        ['devsecops', 'devsecops-bg', 'devsecops-canary']
  validations:
    - message: >-
        Images must come from an approved repository for the target namespace:
        devsecops and devsecops-bg allow aimocont2020/node-api-poc and
        aimocont2020/devsecops-demo; devsecops-canary allows only
        aimocont2020/node-api-poc.
      expression: >-
        object.spec.containers.all(c,
          c.image.split('@')[0].split(':')[0] in
            (object.metadata.namespace == 'devsecops-canary'
              ? ['aimocont2020/node-api-poc', 'docker.io/aimocont2020/node-api-poc']
              : [
                  'aimocont2020/node-api-poc',
                  'docker.io/aimocont2020/node-api-poc',
                  'aimocont2020/devsecops-demo',
                  'docker.io/aimocont2020/devsecops-demo'
                ])
        ) &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c,
            c.image.split('@')[0].split(':')[0] in
              (object.metadata.namespace == 'devsecops-canary'
                ? ['aimocont2020/node-api-poc', 'docker.io/aimocont2020/node-api-poc']
                : [
                    'aimocont2020/node-api-poc',
                    'docker.io/aimocont2020/node-api-poc',
                    'aimocont2020/devsecops-demo',
                    'docker.io/aimocont2020/devsecops-demo'
                  ])
          )
        ) &&
        (!has(object.spec.ephemeralContainers) ||
          object.spec.ephemeralContainers.all(c,
            c.image.split('@')[0].split(':')[0] in
              (object.metadata.namespace == 'devsecops-canary'
                ? ['aimocont2020/node-api-poc', 'docker.io/aimocont2020/node-api-poc']
                : [
                    'aimocont2020/node-api-poc',
                    'docker.io/aimocont2020/node-api-poc',
                    'aimocont2020/devsecops-demo',
                    'docker.io/aimocont2020/devsecops-demo'
                  ])
          )
        )
