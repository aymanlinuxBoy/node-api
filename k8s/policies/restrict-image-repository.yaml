---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: node-api-poc-restrict-image-repository
  annotations:
    policies.kyverno.io/title: Restrict Node API Image Repository
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      In the dedicated Node API namespaces, require containers to use the
      approved node-api-poc image repository rather than trusting all of Docker Hub.
spec:
  # Audit first; move to Deny after reviewing Audit findings and testing.
  validationActions:
    - Audit
  # Evaluation errors should not block workloads during the audit phase.
  # For production enforcement, use failurePolicy: Fail with validationActions: [Deny].
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - pods
          - pods/ephemeralcontainers
  matchConditions:
    - name: node-api-namespaces-only
      expression: >-
        object.metadata.namespace in
        ['devsecops', 'devsecops-bg', 'devsecops-canary']
  validations:
    - message: >-
        Only docker.io/aimocont2020/node-api-poc images are approved in the
        dedicated Node API namespaces. Review and explicitly approve any
        additional image repositories before using them.
      expression: >-
        object.spec.containers.all(c,
          c.image == 'aimocont2020/node-api-poc' ||
          c.image == 'docker.io/aimocont2020/node-api-poc' ||
          c.image.startsWith('aimocont2020/node-api-poc:') ||
          c.image.startsWith('docker.io/aimocont2020/node-api-poc:') ||
          c.image.startsWith('aimocont2020/node-api-poc@sha256:') ||
          c.image.startsWith('docker.io/aimocont2020/node-api-poc@sha256:')
        ) &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c,
            c.image == 'aimocont2020/node-api-poc' ||
            c.image == 'docker.io/aimocont2020/node-api-poc' ||
            c.image.startsWith('aimocont2020/node-api-poc:') ||
            c.image.startsWith('docker.io/aimocont2020/node-api-poc:') ||
            c.image.startsWith('aimocont2020/node-api-poc@sha256:') ||
            c.image.startsWith('docker.io/aimocont2020/node-api-poc@sha256:')
          )
        ) &&
        (!has(object.spec.ephemeralContainers) ||
          object.spec.ephemeralContainers.all(c,
            c.image == 'aimocont2020/node-api-poc' ||
            c.image == 'docker.io/aimocont2020/node-api-poc' ||
            c.image.startsWith('aimocont2020/node-api-poc:') ||
            c.image.startsWith('docker.io/aimocont2020/node-api-poc:') ||
            c.image.startsWith('aimocont2020/node-api-poc@sha256:') ||
            c.image.startsWith('docker.io/aimocont2020/node-api-poc@sha256:')
          )
        )
