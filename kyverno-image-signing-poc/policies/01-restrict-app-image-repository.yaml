apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-node-api-image-repository
  annotations:
    policies.kyverno.io/title: Restrict Node API Image Repository
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Restricts images in the dedicated Node API namespaces to the approved
      node-api-poc repository. Hosting an image on Docker Hub alone is not
      considered a trust signal.
spec:
  validationActions:
    - Audit
  # Audit-first: don't block admissions if the policy evaluation itself errors.
  # Set to Fail when validationActions is changed to Deny.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: node-api-namespaces-only
      expression: "object.metadata.namespace in ['devsecops', 'devsecops-canary', 'devsecops-bg']"
  validations:
    - message: >-
        Only images from docker.io/aimocont2020/node-api-poc are allowed in
        the dedicated Node API namespaces. Explicitly review and approve any
        additional repository before using it.
      expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('docker.io/aimocont2020/node-api-poc:') ||
          c.image.startsWith('docker.io/aimocont2020/node-api-poc@sha256:') ||
          c.image.startsWith('aimocont2020/node-api-poc:') ||
          c.image.startsWith('aimocont2020/node-api-poc@sha256:')
        ) &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c,
            c.image.startsWith('docker.io/aimocont2020/node-api-poc:') ||
            c.image.startsWith('docker.io/aimocont2020/node-api-poc@sha256:') ||
            c.image.startsWith('aimocont2020/node-api-poc:') ||
            c.image.startsWith('aimocont2020/node-api-poc@sha256:')
          )
        )
