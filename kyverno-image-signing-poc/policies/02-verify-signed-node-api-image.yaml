apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-signed-node-api-image
  annotations:
    policies.kyverno.io/title: Verify Signed Node API Image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires the Node API image to have a valid Cosign keyless signature
      from the trusted GitHub Actions workflow identity.
spec:
  validationActions:
    - Audit
  # Audit-first: report validation failures without blocking admissions.
  # Set to Fail with validationActions Deny when moving to enforcement.
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: node-api-namespaces-only
      expression: "object.metadata.namespace in ['devsecops', 'devsecops-canary', 'devsecops-bg']"
  matchImageReferences:
    - glob: 'docker.io/aimocont2020/node-api-poc:*'
    - glob: 'docker.io/aimocont2020/node-api-poc@*'
    - glob: 'aimocont2020/node-api-poc:*'
    - glob: 'aimocont2020/node-api-poc@*'
  attestors:
    - name: githubActionsMain
      cosign:
        keyless:
          identities:
            - subject: 'https://github.com/aymanlinuxBoy/node-api/.github/workflows/ci-security.yml@refs/heads/main'
              issuer: 'https://token.actions.githubusercontent.com'
        ctlog:
          url: 'https://rekor.sigstore.dev'
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.githubActionsMain])
        ).all(result, result > 0)
      message: >-
        Every image evaluated by this policy must have a valid Cosign signature
        from the trusted node-api CI workflow.
